# CodSpeed performance tracking.
#
# Builds the criterion benchmark suites (dora-message, dora-node-api,
# dora-daemon) with `cargo-codspeed` and runs them under CodSpeed's CPU
# simulation instrument, which gives deterministic, low-variance results
# and per-benchmark flame graphs. Reports are posted on pull requests and
# compared against `main`.
#
# The benches use `codspeed-criterion-compat` renamed to `criterion`, so a
# plain `cargo bench` (and the `bench` job in ci.yml) still runs regular
# criterion locally.
name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CodSpeed trigger backtest runs to build initial history.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.97.1"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Pin toolchain set for a stable rust-cache key (see ci.yml header)
        shell: bash
        run: |
          rustup default "$RUST_VERSION"
          extra="$(rustup toolchain list | awk '{print $1}' | grep -vF "$RUST_VERSION" || true)"
          for tc in $extra; do rustup toolchain uninstall "$tc" || true; done
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codspeed
          # Save only on `main`; PRs restore-only (see ci.yml header).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Free disk space
        shell: bash
        run: |
          set -eux
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/lib/jvm \
            /opt/hostedtoolcache/CodeQL || true
          df -h
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-codspeed
      - name: Build the benchmark targets
        run: >
          cargo codspeed build -m simulation
          -p dora-message -p dora-node-api -p dora-daemon
          --features dora-daemon/bench
      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run -p dora-message -p dora-node-api -p dora-daemon
